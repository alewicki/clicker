spring:
  application.name: counter
  main.lazy-initialization: true
  jmx.enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 2s
server:undertow.threads:
  io: 2
  worker: 4
keys:
  mode: ROBOT
  #  mode: HID
  #  enabled: SPACE,A,S,D,W,E,Q,R,CTRL,SHIFT,ALT,LPM,PPM
  enabled: SPACE,A,D
  #click time in ms min+random delta 50-delta
  click:
    time:
      min: 50
      delta: 1000
    #time interval in ms between clicks min+random delta 1-31 s
    interval:
      min: 1000
      delta: 3000
  #cost per 1 click in pln
  cost: 2
server.shutdown: graceful
tipply:
  enabled: true
  url: https://tipply.pl/api/public/tip/ranking/last-ten/vaxontft
#  url: http://localhost:8080/test
